# Automatikus tesztek minden pushnál és pull requestnél (hálózat és API-kulcs nélkül, hamis szerverrel futnak)
name: Tesztek

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  teszt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
