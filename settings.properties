# Magyar Sakkelemző – beállítások (amíg nincs beállító felület)
# Formátum: kulcs=érték. A szerver minden kérésnél újraolvassa, a böngészőben F5 után lép életbe.
# FIGYELEM: ide soha ne írj API-kulcsot! A kulcs az .env fájlba kerül (GEMINI_API_KEY).

# ---- AI-elemzés (Gemini) ----
# Modell (a GEMINI_MODEL környezeti változó felülírja)
ai.model=gemini-2.5-flash
# Kreativitás: 0 = száraz, 1 = játékos
ai.temperature=0.7
# A válasz legnagyobb hossza tokenben
ai.maxOutputTokens=1024
# A modell „gondolkodási” kerete; 0 = ki (gyorsabb, olcsóbb)
ai.thinkingBudget=0
# Árak USD-ben 1 millió tokenre (költségbecsléshez; a Google díjszabása szerint ellenőrizd és igazítsd!)
# gemini-2.5-flash fizetős szint; ingyenes szinten a tényleges költség 0
ai.price.inputPerMTok=0.30
ai.price.outputPerMTok=2.50
# Az elemzés kért hossza szavakban (hogy kiférjen az oldalra)
ai.maxWords=90

# ---- Lépések lejátszása a táblán (piros kiemelés) ----
# Az AI-elemzés elkészültekor magától induljon-e
replay.autoStart=true
# Hány másodpercenként lépjen egyet
replay.stepSeconds=3
# Ismétlődjön-e, amíg le nem állítod (⏹ vagy ▶ tovább gomb)
replay.loop=true

# ---- Felolvasás ----
# Az AI-elemzés elkészültekor magától induljon-e a felolvasás. Ha igen, a lépések a felolvasással
# szinkronban, pirosan jelennek meg (és nem az időzített lejátszás fut)
speech.autoStart=false
# Felolvasás közben villogtassa a szövegben hivatkozott mezőket (pl. „az e5-ös gyalogot”) a mondat végéig:
# az AI-elemzésnél pirosan, a PGN-kommentár felolvasásánál sárgán (a kommentárnál az állás nem mozdul)
speech.blinkSquares=true
speech.lang=hu-HU
# 0.5 – 2, az 1 a normál sebesség
speech.rate=1
speech.pitch=1.05

# ---- Tábla ----
# Az aktuális lépés nyila: honnan hová ment a bábu (zöld nyíl)
board.moveArrow=true
# A motor javasolt (következő) lépésének nyila is; alapból ki (nem szükséges)
board.engineArrow=false

# ---- Animáció (bábuk lassú odacsúszása, ütésnél az ütött bábu elhalványul) ----
animation.enabled=true
# Minden mozgásra érvényes (kézi léptetés, játszma-lejátszás, AI-lejátszás), ezredmásodpercben
animation.ms=900

# ---- A PGN-játszma automatikus lejátszása (⏵ Játszma gomb; sárga kiemelés, ugyanaz az animáció) ----
# Hány másodpercenként lépjen egyet
play.stepSeconds=3

# ---- Játszmakönyvtár (letöltött .pgn fájlok) ----
# A mappa a projektmappához képest (vagy abszolút útvonal); a program beolvassa, és kereshető listát készít belőle
games.dir=games

# ---- Kommentárok fordítása magyarra (Gemini) ----
# Automatikusan fordít, amikor megnyitsz egy játszmát (nincs gomb). Csak a nem magyar kommentárokat fordítja,
# és minden szöveget csak egyszer: az eredmény gyorsítótárba kerül (translate-cache.json, böngésző), újra nem kerül tokenbe
translate.enabled=true
translate.auto=true
# Ha egy játszma kommentárjai együtt ennél hosszabbak (karakter), nem fordít mindent egyszerre, csak az aktuális lépés környékét (tokenkímélés)
translate.maxChars=20000
# Egy kérés legnagyobb mérete szerveroldalon (karakter) és a válasz tokenkerete
translate.maxRequestChars=24000
translate.maxOutputTokens=8192
# Fordításhoz használt modell; üresen az ai.model (pl. olcsóbb modellre állítható)
translate.model=
# Online keresés: játszmánként legalább ennyi komment / karakter kell, különben a játszma nem jelenik meg és nem töltődik le
online.minComments=2
online.minChars=80
